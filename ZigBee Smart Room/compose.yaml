services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./host/mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.14.0
    restart: unless-stopped
    depends_on: [mosquitto]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Etc/UTC
    volumes:
      - ./host/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - ${ZIGBEE_SERIAL_PORT:-/dev/ttyACM0}:/dev/ttyACM0
  room-controller:
    build:
      context: .
      dockerfile: host/coordinator/Dockerfile
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      ROOM_CONFIG: /app/config.json
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
volumes:
  mosquitto_data:
  mosquitto_log:
